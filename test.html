
<svg width="200" height="200">
  <rect x="50" y="50" width="100" height="100" fill="blue" id="myRect">
    <animateTransform
      id="myAnimation"
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="1s"
      begin="indefinite"
      fill="freeze" />
  </rect>
</svg>

<script>
  const rect = document.getElementById("myRect");
  const anim = document.getElementById("myAnimation");

  rect.addEventListener("click", () => {
    anim.beginElement();
  });
</script>
